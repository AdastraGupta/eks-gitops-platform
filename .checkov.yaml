# ─────────────────────────────────────────────────────────────────────────────
# Checkov Static Code Analysis Configuration
# Reference: https://www.checkov.io/2.Basics/Configuring%20Checkov.html
# ─────────────────────────────────────────────────────────────────────────────

directory:
  - terraform
  - k8s

framework:
  - terraform
  - kubernetes

# Format and reporting
output: cli
quiet: true
compact: true
soft-fail: true

# Example: to skip specific checks that are accepted in this environment, uncomment below:
# skip-check:
#   - CKV_AWS_144  # S3 cross-region replication (not required in dev)
#   - CKV_AWS_18   # S3 access logging (dev state bucket)
