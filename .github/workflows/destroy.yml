# ─── GitHub Actions: Infrastructure Teardown (Destroy) Workflow ────────────────
#
# Dedicated manual-only workflow for tearing down AWS cloud infrastructure.
#
# Safety features:
#   - Explicit manual trigger only (workflow_dispatch)
#   - Requires typing the exact target environment name to prevent accidental execution
#   - GitHub Environment gate (${environment}-destroy) for review approvals
#   - Pre-destroy cleanup of Kubernetes Ingress NLBs to release ENIs prior to VPC teardown
#   - OIDC-based temporary AWS authentication (no long-lived keys)
#   - Optional MS Teams notification on teardown completion/failure
# ──────────────────────────────────────────────────────────────────────────────

name: "Terraform — Teardown (Manual Destroy)"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      confirm_destroy:
        description: "Type the environment name (e.g. 'dev') to confirm destructive teardown"
        required: true
        type: string
        default: ""

concurrency:
  group: terraform-destroy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write       # Required for AWS OIDC authentication (STS)
  contents: read        # Required to checkout the repository

env:
  TF_VERSION: "1.9.5"
  TF_WORKING_DIR: "terraform"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  destroy:
    name: "💣 Teardown (${{ github.event.inputs.environment || 'dev' }})"
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}-destroy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Safety Check: Enforce explicit environment confirmation ────────────
      - name: Validate Confirmation
        run: |
          TARGET_ENV="${{ github.event.inputs.environment }}"
          CONFIRM_INPUT="${{ github.event.inputs.confirm_destroy }}"
          echo "Target environment: $TARGET_ENV"
          echo "Confirmation entered: $CONFIRM_INPUT"

          if [ "$CONFIRM_INPUT" != "$TARGET_ENV" ]; then
            echo "::error::Confirmation mismatch! Entered '$CONFIRM_INPUT', expected '$TARGET_ENV'. Teardown aborted."
            exit 1
          fi
          echo "✅ Confirmation valid. Proceeding with teardown of '$TARGET_ENV'."

      # ── AWS Authentication via OIDC ────────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform-destroy-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── Terraform Init ─────────────────────────────────────────────────────
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=k8s-task-manager/${{ github.event.inputs.environment || 'dev' }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ── Pre-destroy cleanup: release NLB ENIs before VPC destruction ───────
      - name: Pre-destroy NLB cleanup
        run: |
          echo "⚠️ Cleaning up NLB services to release ENIs before VPC destroy..."
          CLUSTER_NAME="${{ vars.EKS_CLUSTER_NAME || 'taskmanager-cluster' }}"
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name "$CLUSTER_NAME" || \
            aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name "taskmanager-cluster-${{ github.event.inputs.environment || 'dev' }}" || true

          # Delete Ingress Controller NLBs so AWS decouples ENIs from VPC subnets
          kubectl delete svc nginx-public-ingress-nginx-controller -n ingress-nginx --ignore-not-found=true || true
          kubectl delete svc nginx-internal-ingress-nginx-controller -n ingress-nginx --ignore-not-found=true || true
          
          echo "Waiting 60s for AWS ENIs to detach..."
          sleep 60
        continue-on-error: true

      # ── Terraform Destroy ──────────────────────────────────────────────────
      - name: Terraform Destroy
        id: destroy
        run: |
          terraform destroy \
            -var="environment=${{ github.event.inputs.environment || 'dev' }}" \
            -var="db_password=${{ secrets.TF_VAR_db_password || 'DevSecret123!' }}" \
            -var="teams_webhook_url=${{ secrets.TEAMS_WEBHOOK_URL || '' }}" \
            -auto-approve \
            -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_teams_webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}

      # ── Post Summary to GitHub Step Summary ────────────────────────────────
      - name: Generate Teardown Summary
        if: always()
        run: |
          STATUS="${{ steps.destroy.outcome == 'success' && '✅ Completed' || '❌ Failed' }}"
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 💣 Infrastructure Teardown Report

          | Property | Value |
          |---|---|
          | **Environment** | `${{ github.event.inputs.environment || 'dev' }}` |
          | **Status** | **$STATUS** |
          | **Triggered By** | `@${{ github.actor }}` |
          | **Action** | `terraform destroy` |
          | **Timestamp** | `$(date -u)` |

          > [!WARNING]
          > All Terraform-managed cloud resources in this environment have been scheduled for termination.
          EOF

      # ── Optional: Send MS Teams Notification ───────────────────────────────
      - name: Send MS Teams Notification
        if: always()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        uses: actions/github-script@v7
        with:
          script: |
            const webhookUrl = process.env.TEAMS_WEBHOOK_URL;
            if (!webhookUrl) {
              console.log('TEAMS_WEBHOOK_URL not configured. Skipping MS Teams notification.');
              return;
            }

            const outcome = '${{ steps.destroy.outcome }}';
            const isSuccess = outcome === 'success';
            const envName = '${{ github.event.inputs.environment || 'dev' }}';

            const themeColor = isSuccess ? 'E81123' : 'D83B01';
            const title = isSuccess 
              ? `💣 Terraform Teardown Completed — ${envName}`
              : `❌ Terraform Teardown Failed — ${envName}`;

            const facts = [
              { name: 'Environment', value: envName },
              { name: 'Status', value: isSuccess ? 'Destroyed 🗑️' : 'Failed ❌' },
              { name: 'Triggered by', value: `@${context.actor}` },
              { name: 'Action', value: 'Infrastructure Teardown' }
            ];

            const actions = [
              {
                "@type": "OpenUri",
                "name": "View Workflow Run",
                "targets": [{ "os": "default", "uri": `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` }]
              }
            ];

            const payload = {
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": themeColor,
              "summary": title,
              "sections": [{
                "activityTitle": title,
                "activitySubtitle": `⚠️ Infrastructure Teardown on ${context.repo.owner}/${context.repo.repo}`,
                "facts": facts,
                "markdown": true
              }],
              "potentialAction": actions
            };

            try {
              const res = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              console.log(`Teams notification sent. Status: ${res.status}`);
            } catch (err) {
              console.error('Error sending Teams notification:', err);
            }
