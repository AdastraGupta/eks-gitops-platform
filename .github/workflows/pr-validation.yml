# ─── GitHub Actions: Pull Request Validation Workflow ─────────────────────────
#
# Dedicated fast-feedback validation pipeline triggered on every Pull Request
# from feature branches targeting 'main' or 'develop'.
#
# Key Features:
#   - Automated cancellation of stale in-progress runs on newer commits
#   - Pre-flight linting & validation:
#       * Terraform format check (terraform fmt)
#       * Terraform syntax & config validation (terraform validate)
#       * Kubernetes YAML syntax & schema checking (k8s/*.yaml)
#       * Helm chart linting (charts/taskmanager)
#   - Terraform Plan generation against Dev AWS environment
#   - Interactive sticky PR comment with status badges, diff summary & collapsible HCL
#   - Uploads tfplan artifacts for review and audit
#   - Purely read-only: Zero apply or mutation of cloud infrastructure
# ──────────────────────────────────────────────────────────────────────────────

name: "PR Validation & Terraform Plan"

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "terraform/**"
      - "k8s/**"
      - "charts/**"
      - ".github/workflows/**"

# ── Cancel previous in-progress runs when new commits are pushed to the PR ───
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write       # Required for AWS OIDC authentication (STS)
  contents: read        # Required to checkout the repository
  pull-requests: write  # Required to post & update PR comments
  issues: write         # Required for commenting API fallback

env:
  TF_VERSION: "1.9.5"
  TF_WORKING_DIR: "terraform"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Job 1: Pre-Flight Validation & Linting
  # ════════════════════════════════════════════════════════════════════════════
  validate:
    name: "🔍 Pre-Flight Validation & Linting"
    runs-on: ubuntu-latest
    outputs:
      fmt_status: ${{ steps.fmt.outcome }}
      validate_status: ${{ steps.validate.outcome }}
      k8s_status: ${{ steps.k8s_lint.outcome }}
      helm_status: ${{ steps.helm_lint.outcome }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.4"

      # ── Terraform Format Check ─────────────────────────────────────────────
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -diff -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      # ── Terraform Validate (syntax & config without remote state) ──────────
      - name: Terraform Validate
        id: validate
        run: |
          terraform init -backend=false
          terraform validate -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      # ── Kubernetes YAML Syntax & Schema Validation ─────────────────────────
      - name: Validate Kubernetes Manifests (k8s/)
        id: k8s_lint
        run: |
          echo "Validating raw Kubernetes manifests in k8s/ directory..."
          python3 -c '
          import os, yaml
          error_count = 0
          for root, _, files in os.walk("k8s"):
              for f in files:
                  if f.endswith((".yaml", ".yml")):
                      path = os.path.join(root, f)
                      print(f"Checking {path}...")
                      try:
                          with open(path, "r", encoding="utf-8") as stream:
                              list(yaml.safe_load_all(stream))
                      except Exception as e:
                          print(f"❌ Error in {path}: {e}")
                          error_count += 1
          if error_count > 0:
              print(f"Found {error_count} manifest error(s).")
              exit(1)
          print("All k8s/*.yaml files passed YAML syntax validation!")
          '
        continue-on-error: true

      # ── Helm Chart Linting ─────────────────────────────────────────────────
      - name: Helm Chart Linting (charts/taskmanager)
        id: helm_lint
        run: |
          echo "Linting Helm chart in charts/taskmanager..."
          helm lint charts/taskmanager
        continue-on-error: true

      # ── Check overall validation outcome ───────────────────────────────────
      - name: Assert All Validations Passed
        run: |
          FAILED=0
          if [ "${{ steps.fmt.outcome }}" != "success" ]; then
            echo "::error::Terraform formatting check failed. Run 'terraform fmt -recursive' locally."
            FAILED=1
          fi
          if [ "${{ steps.validate.outcome }}" != "success" ]; then
            echo "::error::Terraform validate check failed."
            FAILED=1
          fi
          if [ "${{ steps.k8s_lint.outcome }}" != "success" ]; then
            echo "::error::Kubernetes manifest YAML validation failed."
            FAILED=1
          fi
          if [ "${{ steps.helm_lint.outcome }}" != "success" ]; then
            echo "::error::Helm chart linting failed."
            FAILED=1
          fi
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "✅ All pre-flight validation checks passed!"

  # ════════════════════════════════════════════════════════════════════════════
  # Job 2: Terraform Plan (Dry-Run Preview)
  # ════════════════════════════════════════════════════════════════════════════
  plan:
    name: "📋 Terraform Plan (Dry-Run Preview)"
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Authenticate with AWS via OIDC (temporary credentials) ─────────────
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-PR-Plan-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── Terraform Init (Remote S3 State) ───────────────────────────────────
      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=k8s-task-manager/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ── Terraform Plan (Dry Run) ───────────────────────────────────────────
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -input=false \
            -var="environment=dev" \
            -var="db_password=${{ secrets.TF_VAR_db_password || 'DevSecret123!' }}" \
            -var="teams_webhook_url=${{ secrets.TEAMS_WEBHOOK_URL || '' }}" \
            -no-color \
            -out=tfplan > plan_output.txt 2>&1
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      # ── Generate Plan Summary & Metrics ────────────────────────────────────
      - name: Parse Plan Metrics
        id: plan_metrics
        run: |
          if [ -f tfplan ]; then
            terraform show -no-color tfplan > plan_readable.txt 2>/dev/null || true
            ADD=$(grep -c "will be created" plan_readable.txt 2>/dev/null || echo "0")
            CHANGE=$(grep -c "will be updated" plan_readable.txt 2>/dev/null || echo "0")
            DESTROY=$(grep -c "will be destroyed" plan_readable.txt 2>/dev/null || echo "0")
            echo "add=$ADD" >> $GITHUB_OUTPUT
            echo "change=$CHANGE" >> $GITHUB_OUTPUT
            echo "destroy=$DESTROY" >> $GITHUB_OUTPUT
          else
            echo "add=0" >> $GITHUB_OUTPUT
            echo "change=0" >> $GITHUB_OUTPUT
            echo "destroy=0" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ── Post or Update Sticky PR Comment ───────────────────────────────────
      - name: Post / Update Sticky PR Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = '${{ env.TF_WORKING_DIR }}/plan_output.txt';
            let planOutput = 'No plan output generated or plan failed before execution.';
            if (fs.existsSync(planPath)) {
              planOutput = fs.readFileSync(planPath, 'utf8');
              if (planOutput.length > 55000) {
                planOutput = planOutput.substring(0, 55000) + '\n\n... (plan output truncated, see GitHub Actions logs for full trace)';
              }
            }

            const planOutcome = '${{ steps.plan.outcome }}';
            const isSuccess = planOutcome === 'success';
            const planBadge = isSuccess ? '✅ Passed' : '❌ Failed';
            const add = '${{ steps.plan_metrics.outputs.add }}' || '0';
            const change = '${{ steps.plan_metrics.outputs.change }}' || '0';
            const destroy = '${{ steps.plan_metrics.outputs.destroy }}' || '0';

            const body = `### 🔍 PR Validation & Terraform Plan Results

            | Check | Status | Details |
            |---|---|---|
            | 📐 **Terraform Format** | \`${{ needs.validate.outputs.fmt_status == 'success' && '✅ Passed' || '❌ Failed' }}\` | \`terraform fmt -check\` |
            | ⚙️ **Terraform Validate** | \`${{ needs.validate.outputs.validate_status == 'success' && '✅ Passed' || '❌ Failed' }}\` | \`terraform validate\` |
            | ☸️ **Kubernetes Manifests** | \`${{ needs.validate.outputs.k8s_status == 'success' && '✅ Passed' || '❌ Failed' }}\` | \`k8s/*.yaml\` syntax check |
            | 📦 **Helm Chart** | \`${{ needs.validate.outputs.helm_status == 'success' && '✅ Passed' || '❌ Failed' }}\` | \`helm lint charts/taskmanager\` |
            | 📋 **Terraform Plan (Dev)** | **${planBadge}** | **+${add} to add, ~${change} to change, -${destroy} to destroy** |

            <details>
            <summary>📄 <strong>Click to View Terraform Plan Output</strong></summary>

            \`\`\`hcl
            ${planOutput}
            \`\`\`

            </details>

            ---
            *Commit:* \`${context.sha.substring(0, 7)}\` | *Run ID:* [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) | *Triggered by:* @${context.actor}`;

            // Search for existing sticky comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('PR Validation & Terraform Plan Results')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
              console.log(`Updated existing PR comment #${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
              console.log('Created new PR comment');
            }

      # ── Upload Plan Artifact ───────────────────────────────────────────────
      - name: Upload Plan Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-tfplan-${{ github.run_id }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan_output.txt
          retention-days: 7

      # ── Generate GitHub Step Summary ───────────────────────────────────────
      - name: Generate Step Summary
        if: always()
        run: |
          STATUS="${{ steps.plan.outcome == 'success' && '✅ Passed' || '❌ Failed' }}"
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🔍 PR Validation Summary

          | Check | Status |
          |---|---|
          | **Pre-Flight Validation** | \`${{ needs.validate.result }}\` |
          | **Terraform Plan (Dev)** | **$STATUS** |
          | **Resource Changes** | \`+${{ steps.plan_metrics.outputs.add }} to add, ~${{ steps.plan_metrics.outputs.change }} to change, -${{ steps.plan_metrics.outputs.destroy }} to destroy\` |
          | **Target Branch** | \`${{ github.base_ref }}\` |
          | **Head Branch** | \`${{ github.head_ref }}\` |

          > [!NOTE]
          > This PR validation is purely read-only and does not apply changes to AWS cloud infrastructure.
          EOF

      # ── Fail job if plan failed ────────────────────────────────────────────
      - name: Check Plan Outcome
        if: steps.plan.outcome == 'failure'
        run: |
          echo "::error::Terraform plan execution failed. Review log output above."
          exit 1
