# ─── GitHub Actions: Terraform CI/CD Pipeline ──────────────────────────────────
#
# Production-grade workflow for provisioning AWS infrastructure via Terraform.
#
# Pipeline stages:
#   PR (plan-only)  → terraform fmt → init → validate → plan → post comment
#   Push to main    → terraform fmt → init → validate → plan → apply (auto)
#   Manual trigger  → terraform fmt → init → validate → plan → apply
#
# Security:
#   - AWS credentials via OIDC (no long-lived access keys)
#   - Terraform state in S3 + DynamoDB locking
#   - Sensitive outputs masked
#   - Least-privilege IAM role
#
# Required / Optional GitHub Secrets:
#   - AWS_ROLE_ARN          : IAM Role ARN for OIDC federation
#   - TF_VAR_db_password    : RDS master password (injected as TF variable)
#   - TEAMS_WEBHOOK_URL     : (Optional) Microsoft Teams incoming webhook URL for CI/CD alerts
#
# Required GitHub Variables (Settings → Variables):
#   - AWS_REGION            : e.g. us-east-1
#   - TF_STATE_BUCKET       : S3 bucket name for Terraform state
#   - TF_STATE_LOCK_TABLE   : DynamoDB table name for state locking
# ──────────────────────────────────────────────────────────────────────────────

name: "Terraform — Infrastructure CI/CD"

on:
  # ── Pull Request: plan only (no changes applied) ─────────────────────────
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

  # ── Push to main: auto-apply after successful plan ───────────────────────
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

  # ── Manual trigger: plan or apply ────────────────────────────────────────
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to perform"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      efk_enabled:
        description: "Deploy EFK logging stack?"
        required: false
        type: boolean
        default: true
      monitoring_enabled:
        description: "Deploy Prometheus + Grafana monitoring stack?"
        required: false
        type: boolean
        default: true
      argocd_enabled:
        description: "Deploy ArgoCD GitOps controller via Helm?"
        required: false
        type: boolean
        default: true
      tracing_enabled:
        description: "Deploy Jaeger distributed tracing stack via Helm?"
        required: false
        type: boolean
        default: true
      k8sgpt_enabled:
        description: "Deploy K8sGPT Operator (AI-powered incident triage via AWS Bedrock)?"
        required: false
        type: boolean
        default: true
      karpenter_enabled:
        description: "Deploy Karpenter just-in-time EC2 node autoscaler?"
        required: false
        type: boolean
        default: true
      keda_enabled:
        description: "Deploy KEDA event-driven pod autoscaler + Kubernetes Metrics Server?"
        required: false
        type: boolean
        default: true

# ── Concurrency: prevent parallel runs on the same branch ──────────────────
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false  # Never cancel in-progress applies

# ── Permissions: minimal required for OIDC + PR comments ───────────────────
permissions:
  id-token: write       # Required for OIDC authentication with AWS
  contents: read        # Required to checkout the repository
  pull-requests: write  # Required to post plan output as PR comment
  issues: write         # Required for workflow_dispatch status comments

# ── Environment Variables ──────────────────────────────────────────────────
env:
  TF_VERSION: "1.9.5"
  TF_WORKING_DIR: "terraform"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Job 1: Terraform Format Check
  # ════════════════════════════════════════════════════════════════════════════
  format:
    name: "🔍 Format Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive -diff
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      - name: Post format failure on PR
        if: steps.fmt.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### ❌ Terraform Format Check Failed

            Some files are not properly formatted. Run \`terraform fmt -recursive\` locally and push the changes.

            \`\`\`
            ${{ steps.fmt.outputs.stdout }}
            \`\`\`

            *Workflow: \`${{ github.workflow }}\` | Triggered by: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail on format errors
        if: steps.fmt.outcome == 'failure'
        run: exit 1

  # ════════════════════════════════════════════════════════════════════════════
  # Job 2: Terraform Validate & Plan
  # ════════════════════════════════════════════════════════════════════════════
  plan:
    name: "📋 Plan"
    runs-on: ubuntu-latest
    needs: format
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── AWS Authentication via OIDC (no static credentials) ────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── Cache Terraform providers for faster init ──────────────────────────
      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_WORKING_DIR }}/.terraform/providers
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-

      # ── Terraform Init ─────────────────────────────────────────────────────
      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=k8s-task-manager/${{ github.event.inputs.environment || 'dev' }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ── Terraform Validate ─────────────────────────────────────────────────
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ── Terraform Plan ─────────────────────────────────────────────────────
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="environment=${{ github.event.inputs.environment || 'dev' }}" \
            -var="efk_enabled=${{ github.event.inputs.efk_enabled || 'true' }}" \
            -var="monitoring_enabled=${{ github.event.inputs.monitoring_enabled || 'true' }}" \
            -var="argocd_enabled=${{ github.event.inputs.argocd_enabled || 'true' }}" \
            -var="tracing_enabled=${{ github.event.inputs.tracing_enabled || 'true' }}" \
            -var="k8sgpt_enabled=${{ github.event.inputs.k8sgpt_enabled || 'true' }}" \
            -var="karpenter_enabled=${{ github.event.inputs.karpenter_enabled || 'true' }}" \
            -var="keda_enabled=${{ github.event.inputs.keda_enabled || 'true' }}" \
            -detailed-exitcode \
            -no-color \
            -out=tfplan \
            2>&1 | tee plan_output.txt
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_teams_webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}

      # ── Generate plan summary ──────────────────────────────────────────────
      - name: Generate plan summary
        if: always()
        id: plan_summary
        run: |
          if [ -f tfplan ]; then
            terraform show -no-color tfplan > plan_readable.txt
            # Extract resource counts
            ADD=$(grep -c "will be created" plan_readable.txt 2>/dev/null || echo "0")
            CHANGE=$(grep -c "will be updated" plan_readable.txt 2>/dev/null || echo "0")
            DESTROY=$(grep -c "will be destroyed" plan_readable.txt 2>/dev/null || echo "0")
            echo "add=$ADD" >> $GITHUB_OUTPUT
            echo "change=$CHANGE" >> $GITHUB_OUTPUT
            echo "destroy=$DESTROY" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ── Post plan as PR comment ────────────────────────────────────────────
      - name: Post plan on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = '${{ env.TF_WORKING_DIR }}/plan_output.txt';
            let planOutput = 'No plan output available.';
            if (fs.existsSync(planPath)) {
              planOutput = fs.readFileSync(planPath, 'utf8');
              // Truncate to fit GitHub comment limit (65536 chars)
              if (planOutput.length > 60000) {
                planOutput = planOutput.substring(0, 60000) + '\n\n... (truncated, see workflow logs for full output)';
              }
            }

            const exitCode = '${{ steps.plan.outcome }}';
            const emoji = exitCode === 'success' ? '✅' : '❌';
            const add = '${{ steps.plan_summary.outputs.add }}' || '0';
            const change = '${{ steps.plan_summary.outputs.change }}' || '0';
            const destroy = '${{ steps.plan_summary.outputs.destroy }}' || '0';

            const output = `### ${emoji} Terraform Plan Results

            | Step | Status |
            |------|--------|
            | 🔍 Format | \`${{ steps.fmt.outcome || 'passed' }}\` |
            | ⚙️ Init   | \`${{ steps.init.outcome }}\` |
            | ✅ Validate | \`${{ steps.validate.outcome }}\` |
            | 📋 Plan   | \`${exitCode}\` |

            **Summary:** \`${add}\` to add, \`${change}\` to change, \`${destroy}\` to destroy.

            <details><summary>📄 Show Plan Output</summary>

            \`\`\`hcl
            ${planOutput}
            \`\`\`

            </details>

            *Environment: \`${{ github.event.inputs.environment || 'dev' }}\` | Workflow: \`${{ github.workflow }}\` | Triggered by: @${{ github.actor }}*`;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Terraform Plan Results')
            );

            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              });
            }

      # ── Send MS Teams Notification (Plan) ──────────────────────────────────
      - name: Send MS Teams Notification (Plan)
        if: always()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        uses: actions/github-script@v7
        with:
          script: |
            const webhookUrl = process.env.TEAMS_WEBHOOK_URL;
            if (!webhookUrl) {
              console.log('TEAMS_WEBHOOK_URL not configured. Skipping MS Teams notification.');
              return;
            }

            const outcome = '${{ steps.plan.outcome }}';
            const isSuccess = outcome === 'success';
            const envName = '${{ github.event.inputs.environment || 'dev' }}';
            const add = '${{ steps.plan_summary.outputs.add }}' || '0';
            const change = '${{ steps.plan_summary.outputs.change }}' || '0';
            const destroy = '${{ steps.plan_summary.outputs.destroy }}' || '0';

            const themeColor = isSuccess ? '0076D7' : 'D83B01';
            const title = isSuccess 
              ? `📋 Terraform Plan Succeeded — ${envName}`
              : `❌ Terraform Plan Failed — ${envName}`;

            const facts = [
              { name: 'Environment', value: envName },
              { name: 'Status', value: isSuccess ? 'Plan Ready ✅' : 'Failed ❌' },
              { name: 'Changes', value: `+${add} to add, ~${change} to change, -${destroy} to destroy` },
              { name: 'Triggered by', value: `@${context.actor}` },
              { name: 'Event', value: context.eventName }
            ];

            if (context.payload.pull_request) {
              facts.push({ name: 'Pull Request', value: `#${context.payload.pull_request.number} (${context.payload.pull_request.title})` });
            }

            const actions = [
              {
                "@type": "OpenUri",
                "name": "View Workflow Run",
                "targets": [{ "os": "default", "uri": `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` }]
              }
            ];

            if (context.payload.pull_request) {
              actions.push({
                "@type": "OpenUri",
                "name": "View Pull Request",
                "targets": [{ "os": "default", "uri": context.payload.pull_request.html_url }]
              });
            }

            const payload = {
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": themeColor,
              "summary": title,
              "sections": [{
                "activityTitle": title,
                "activitySubtitle": `Repository: ${context.repo.owner}/${context.repo.repo}`,
                "facts": facts,
                "markdown": true
              }],
              "potentialAction": actions
            };

            try {
              const res = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              console.log(`Teams notification sent. Status: ${res.status}`);
            } catch (err) {
              console.error('Error sending Teams notification:', err);
            }

      # ── Fail if plan errored ───────────────────────────────────────────────
      - name: Check plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # ── Upload plan artifact for the apply job ─────────────────────────────
      - name: Upload plan artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

  # ════════════════════════════════════════════════════════════════════════════
  # Job 3: Terraform Apply
  # ════════════════════════════════════════════════════════════════════════════
  apply:
    name: "🚀 Apply"
    runs-on: ubuntu-latest
    needs: plan
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
      url: ${{ steps.outputs.outputs.dashboard_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform-apply-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=k8s-task-manager/${{ github.event.inputs.environment || 'dev' }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ── Download the plan artifact from the plan job ────────────────────────
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      # ── Apply the pre-approved plan ─────────────────────────────────────────
      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve -no-color tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_teams_webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}

      # ── Capture outputs for downstream use ──────────────────────────────────
      - name: Capture Terraform outputs
        id: outputs
        if: steps.apply.outcome == 'success'
        run: |
          echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT
          echo "cluster_endpoint=$(terraform output -raw cluster_endpoint)" >> $GITHUB_OUTPUT
          echo "dashboard_url=$(terraform output -raw cloudwatch_dashboard_url)" >> $GITHUB_OUTPUT
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ── Post apply summary ──────────────────────────────────────────────────
      - name: Post apply summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.apply.outcome }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const env = '${{ github.event.inputs.environment || 'dev' }}';

            const summary = `### ${emoji} Terraform Apply — ${env}

            | Detail | Value |
            |--------|-------|
            | **Status** | \`${status}\` |
            | **Environment** | \`${env}\` |
            | **Cluster** | \`${{ steps.outputs.outputs.cluster_name || 'N/A' }}\` |
            | **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | **Actor** | @${{ github.actor }} |
            | **Commit** | \`${{ github.sha }}\` |`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: status === 'success' ? 'success' : 'failure',
              description: `Terraform apply ${status}`,
              context: 'terraform/apply'
            });

      # ── Send MS Teams Notification (Apply) ─────────────────────────────────
      - name: Send MS Teams Notification (Apply)
        if: always()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        uses: actions/github-script@v7
        with:
          script: |
            const webhookUrl = process.env.TEAMS_WEBHOOK_URL;
            if (!webhookUrl) {
              console.log('TEAMS_WEBHOOK_URL not configured. Skipping MS Teams notification.');
              return;
            }

            const outcome = '${{ steps.apply.outcome }}';
            const isSuccess = outcome === 'success';
            const envName = '${{ github.event.inputs.environment || 'dev' }}';
            const clusterName = '${{ steps.outputs.outputs.cluster_name }}' || 'taskmanager-cluster';
            const dashboardUrl = '${{ steps.outputs.outputs.dashboard_url }}';

            const themeColor = isSuccess ? '107C10' : 'D83B01';
            const title = isSuccess 
              ? `🚀 Terraform Apply Succeeded — ${envName}`
              : `❌ Terraform Apply Failed — ${envName}`;

            const facts = [
              { name: 'Environment', value: envName },
              { name: 'Status', value: isSuccess ? 'Deployed Successfully ✅' : 'Failed ❌' },
              { name: 'Cluster', value: clusterName },
              { name: 'Triggered by', value: `@${context.actor}` },
              { name: 'Commit', value: `${context.sha.substring(0, 7)}` }
            ];

            const actions = [
              {
                "@type": "OpenUri",
                "name": "View Workflow Run",
                "targets": [{ "os": "default", "uri": `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` }]
              }
            ];

            if (isSuccess && dashboardUrl && dashboardUrl.startsWith('http')) {
              actions.push({
                "@type": "OpenUri",
                "name": "📊 Open CloudWatch Dashboard",
                "targets": [{ "os": "default", "uri": dashboardUrl }]
              });
            }

            const payload = {
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": themeColor,
              "summary": title,
              "sections": [{
                "activityTitle": title,
                "activitySubtitle": `Repository: ${context.repo.owner}/${context.repo.repo}`,
                "facts": facts,
                "markdown": true
              }],
              "potentialAction": actions
            };

            try {
              const res = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              console.log(`Teams notification sent. Status: ${res.status}`);
            } catch (err) {
              console.error('Error sending Teams notification:', err);
            }



