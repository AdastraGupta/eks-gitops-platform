#CICD Pipeline for springboot application

# Trigger([Push / PR]) --> BuildTest["1. build-test (Java 17)<br/>Unit Tests + Package JAR"]
# BuildTest --> CodeQuality["2. code-quality<br/>Semgrep + OWASP + SonarCloud"]
# BuildTest --> BuildImage["3. build-image<br/>Docker Build + Trivy Scan + Push GHCR"]
# CodeQuality --> BuildImage
# BuildImage --> DeployDev["4. deploy-dev<br/>Helm (Dev Namespace, 1 replica)"]
# DeployDev --> IntegrationTests["5. integration-tests<br/>Maven vs Dev Endpoint"]
# IntegrationTests --> DeployStaging["6. deploy-staging<br/>Helm (Staging Namespace, 2 replicas)"]
# DeployStaging --> ProdGate{{"7. Environment Gate<br/>Manual Approval Required"}}
# ProdGate -->|Approved| DeployProd["8. deploy-prod<br/>Canary 10% &rarr; Prometheus Metric Check &rarr; 100%"]
# DeployProd -->|Failure| RollbackProd["9. rollback-prod<br/>Helm Rollback (Production)"]

name: Spring Boot CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY: ghcr.io

jobs:
  # ---------- BUILD & TEST ----------
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Run unit tests
        run: mvn -B test

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maven Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Build JAR
        run: mvn -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ---------- STATIC ANALYSIS / SECURITY ----------
  code-quality:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # SAST (Static Application Security Testing) - Semgrep (works well for Java, no license cost)
      - name: Semgrep scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/java

      # Dependency vulnerability scan
      - name: OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check
        continue-on-error: false # fails build on high-severity CVEs per suppression config

      # Code coverage / quality gate (optional, needs SonarCloud/SonarQube account)
      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify sonar:sonar -Dsonar.projectKey=my-springboot-app

  # ---------- BUILD & SCAN CONTAINER IMAGE ----------
  build-image:
    runs-on: ubuntu-latest
    needs: [build-test, code-quality]
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Generate image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} .

      # Container vulnerability scan - blocks push on critical/high
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

  # ---------- DEPLOY: DEV (auto) ----------
  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-image
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Dev (Helm)
        run: |
          helm upgrade --install springboot-app ./helm/springboot-app \
            --namespace dev --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build-image.outputs.image_tag }} \
            --set replicaCount=1

      - name: Wait for rollout
        run: kubectl rollout status deployment/springboot-app -n dev --timeout=120s

      - name: Smoke test
        run: |
          sleep 10
          curl -f https://dev.myapp.example.com/actuator/health || exit 1

  # ---------- INTEGRATION TESTS ----------
  integration-tests:
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Run integration test suite against Dev
        run: mvn -B verify -Pintegration-test -Dtest.base.url=https://dev.myapp.example.com

  # ---------- DEPLOY: STAGING ----------
  deploy-staging:
    runs-on: ubuntu-latest
    needs: integration-tests
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Staging
        run: |
          helm upgrade --install springboot-app ./helm/springboot-app \
            --namespace staging --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build-image.outputs.image_tag }} \
            --set replicaCount=2
      - name: Wait for rollout
        run: kubectl rollout status deployment/springboot-app -n staging --timeout=180s

  # ---------- DEPLOY: PROD (manual approval via environment) ----------
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production # <-- required reviewers configured in repo Settings > Environments
      url: https://myapp.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Prod (canary via Helm)
        run: |
          helm upgrade --install springboot-app ./helm/springboot-app \
            --namespace production \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build-image.outputs.image_tag }} \
            --set replicaCount=3 \
            --set canary.enabled=true \
            --set canary.weight=10

      - name: Monitor canary health (5 min)
        run: ./scripts/check-canary-metrics.sh # checks error rate/latency via Prometheus API

      - name: Promote canary to 100%
        run: |
          helm upgrade springboot-app ./helm/springboot-app \
            --namespace production \
            --set canary.enabled=false

      - name: Post-deploy smoke test
        run: curl -f https://myapp.example.com/actuator/health || exit 1

  # ---------- ROLLBACK (manual trigger) ----------
  rollback-prod:
    runs-on: ubuntu-latest
    if: failure() && needs.deploy-prod.result == 'failure'
    needs: deploy-prod
    environment:
      name: production
    steps:
      - name: Rollback via Helm
        run: helm rollback springboot-app -n production
