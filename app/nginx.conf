# ─── nginx SPA Configuration ───────────────────────────────────────────────────
#
# Used by: Dockerfile.frontend (COPY nginx.conf /etc/nginx/conf.d/default.conf)
#
# Key requirements for React Router (client-side routing):
#   `try_files $uri $uri/ /index.html` — for any unknown path (e.g. /tasks/42),
#   nginx falls back to index.html and lets React Router handle the route.
#   Without this, a hard refresh on /tasks/42 returns nginx 404.
#
# Performance optimisations:
#   - gzip compression for JS/CSS/HTML (reduces transfer size by ~70%)
#   - Long-lived cache headers for hashed static assets (main.abc123.js)
#   - Short cache for index.html so new deployments are picked up immediately
#
# Security headers:
#   - X-Frame-Options: DENY          — prevents clickjacking
#   - X-Content-Type-Options: nosniff — prevents MIME-type sniffing
#   - Referrer-Policy                  — controls referrer leakage
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen       80;
    server_name  _;          # catch-all — matches any hostname

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Gzip compression ───────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options       "DENY"            always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header Referrer-Policy       "strict-origin"   always;

    # ── React Router SPA fallback ──────────────────────────────────────────────
    # Any request that doesn't match a real file falls back to index.html.
    # React Router then reads window.location and renders the correct component.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Long-lived cache for hashed static assets ──────────────────────────────
    # Create React App / Vite generates filenames like main.abc123.js.
    # Since the hash changes on every build, these files can be cached forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;         # skip access logs for static assets
    }

    # ── Short cache for index.html ────────────────────────────────────────────
    # Must not be cached long — it references the latest hashed asset filenames.
    # no-cache forces the browser to revalidate (ETag/Last-Modified) on each load.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        expires    0;
    }

    # ── Health check endpoint ─────────────────────────────────────────────────
    # Used by the Dockerfile HEALTHCHECK and Kubernetes liveness/readiness probes.
    # Returns 200 with minimal body — no disk I/O, no React processing.
    location = /health {
        access_log  off;
        return      200 "healthy\n";
        add_header  Content-Type text/plain;
    }

    # ── Hide nginx version from error pages and headers ───────────────────────
    server_tokens off;
}
