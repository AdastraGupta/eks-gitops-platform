apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskmanager.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "taskmanager.labels" . | nindent 4 }}
data:
  # ── Application Settings ───────────────────────────────────────────────────
  LOG_LEVEL: {{ .Values.backend.env.logLevel | quote }}
  ENVIRONMENT: {{ .Values.environment | quote }}

  # ── Database Connection (non-sensitive) ────────────────────────────────────
  # DB_PASSWORD is NOT here — it comes from the Kubernetes Secret (managed by Terraform)
  DB_HOST: {{ .Values.backend.env.dbHost | quote }}
  DB_PORT: {{ .Values.backend.env.dbPort | quote }}
  DB_NAME: {{ .Values.backend.env.dbName | quote }}
  DB_USER: {{ .Values.backend.env.dbUser | quote }}
