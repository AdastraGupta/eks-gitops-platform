apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskmanager.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "taskmanager.labels" . | nindent 4 }}
    tier: frontend
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  # When HPA is enabled (prod), remove static replicas so HPA controls the count.
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "taskmanager.frontend.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0               # Zero downtime rolling updates
  template:
    metadata:
      labels:
        {{- include "taskmanager.frontend.selectorLabels" . | nindent 8 }}
        environment: {{ .Values.environment }}
      annotations:
        # Forces pod restart when ConfigMap content changes
        checksum/frontend-config: {{ include (print $.Template.BasePath "/frontend-configmap.yaml") . | sha256sum }}
    spec:
      # Graceful shutdown — allow in-flight requests to complete
      terminationGracePeriodSeconds: 30

      # Spread pods across availability zones
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "taskmanager.frontend.selectorLabels" . | nindent 14 }}

      # Target Karpenter-provisioned application nodes
      nodeSelector:
        {{- toYaml .Values.frontend.nodeSelector | nindent 8 }}

      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.targetPort }}
              protocol: TCP

          # Mount the frontend ConfigMap (Angular build assets + nginx config)
          volumeMounts:
            - name: frontend-config
              mountPath: /etc/nginx/conf.d
              readOnly: true

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

      volumes:
        - name: frontend-config
          configMap:
            name: {{ include "taskmanager.fullname" . }}-frontend-config
