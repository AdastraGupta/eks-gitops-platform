{{- if .Values.frontend.autoscaling.enabled }}
# HPA is only rendered in environments where autoscaling.enabled = true (production).
# In dev and staging this entire file is skipped — static replicaCount is used instead.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "taskmanager.fullname" . }}-frontend-hpa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "taskmanager.labels" . | nindent 4 }}
    tier: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "taskmanager.fullname" . }}-frontend
  minReplicas: {{ .Values.frontend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.frontend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.frontend.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300       # Wait 5 min before scaling down
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60                 # Scale down max 25% per minute
    scaleUp:
      stabilizationWindowSeconds: 0        # Scale up immediately on load spikes
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
{{- end }}
