apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "taskmanager.labels" . | nindent 4 }}
    tier: database
spec:
  # ExternalName maps an in-cluster DNS name (postgres-service) to the
  # actual AWS RDS/Aurora endpoint defined per environment in values-*.yaml.
  # The backend connects to "postgres-service" — the real hostname is injected
  # by the values file without any code change.
  type: ExternalName
  externalName: {{ .Values.postgres.host | quote }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
      protocol: TCP
