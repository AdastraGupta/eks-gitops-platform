# ─── secret.yaml ─────────────────────────────────────────────────────────────
# IMPORTANT: This Secret is NOT created by Helm.
#
# Per the implementation plan (Q3 = Option B), the Secret is created and managed
# by Terraform using the kubernetes_secret resource in terraform/secret.tf.
#
# This file exists only as a REFERENCE to document what Terraform creates.
# ArgoCD and Helm will read the Secret's existence from the cluster — they do NOT
# manage its lifecycle. Helm will not create or delete this Secret.
#
# The Terraform resource that creates this (terraform/secret.tf):
#
#   resource "kubernetes_secret" "taskmanager_db" {
#     metadata {
#       name      = "taskmanager-db-secret"
#       namespace = "taskmanager"
#     }
#     data = {
#       password = var.db_password    # Injected via TF_VAR_db_password in CI/CD
#     }
#     type = "Opaque"
#   }
#
# The backend-deployment.yaml references it via:
#   secretKeyRef:
#     name: taskmanager-db-secret
#     key: password
# ─────────────────────────────────────────────────────────────────────────────
