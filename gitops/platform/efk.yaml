# ─── EFK Logging Stack — Elasticsearch, Fluent Bit, Kibana ──────────────────
#
# Deploys the complete EFK logging stack via three separate ArgoCD Applications,
# all targeting the 'logging' namespace.
#
# Log flow:
#   All Pods → /var/log/containers/*.log
#     → Fluent Bit DaemonSet (enriches with K8s metadata: pod, namespace, labels)
#       → Elasticsearch (indexes as fluent-bit-YYYY.MM.DD)
#         → Kibana (search, visualize, dashboard)
#
# Sync Wave ordering enforces startup sequence:
#   Wave 2: Elasticsearch (storage layer must be ready first)
#   Wave 3: Fluent Bit + Kibana (depend on Elasticsearch)
#
# Access:
#   Kibana: http://<internal-nlb-ip>/kibana  (requires VPN or kubectl port-forward)
#
# Chart sources:
#   - elastic/elasticsearch  (https://helm.elastic.co)
#   - elastic/kibana         (https://helm.elastic.co)
#   - fluent/fluent-bit      (https://fluent.github.io/helm-charts)
# ──────────────────────────────────────────────────────────────────────────────

# ── 1. Elasticsearch ──────────────────────────────────────────────────────────
# Single-node Elasticsearch 8.5.1 for log storage and search.
# Key settings:
#   - Single replica (scale to 3 for HA production)
#   - X-Pack security disabled (no TLS/auth within cluster)
#   - JVM heap capped at 512MB (≤50% of 2Gi container memory limit)
#   - 10Gi EBS gp3 PersistentVolume for data durability
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: efk-elasticsearch
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 2: Must be ready before Fluent Bit and Kibana start
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default

  source:
    repoURL: 'https://helm.elastic.co'
    chart: elasticsearch
    targetRevision: '8.5.1'
    helm:
      releaseName: elasticsearch
      values: |
        imageTag: "8.15.0"

        # Cluster topology
        replicas: 1
        minimumMasterNodes: 1

        # JVM heap — must be ≤ 50% of memory limit
        esJavaOpts: "-Xmx512m -Xms512m"

        # Resources
        resources:
          requests:
            cpu: "250m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"

        # Persistent storage (EBS gp3 — provisioned by terraform/storage.tf)
        volumeClaimTemplate:
          storageClassName: gp3
          resources:
            requests:
              storage: "10Gi"

        # Security disabled (all traffic is VPC-internal)
        secret:
          enabled: false
        createCert: false

        # Single-node discovery + disable X-Pack security
        esConfig:
          elasticsearch.yml: |
            cluster.name: taskmanager-logs
            discovery.type: single-node
            xpack.security.enabled: false
            xpack.security.enrollment.enabled: false
            xpack.security.http.ssl.enabled: false
            xpack.security.transport.ssl.enabled: false

        # Soft anti-affinity (fine for single-node setup)
        antiAffinity: "soft"

        # Pin Elasticsearch StatefulSet to system_nodes (holds 10Gi EBS volume)
        nodeSelector:
          nodegroup: system

        labels:
          component: efk

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true    # Required for Elasticsearch CRDs

---

# ── 2. Fluent Bit ─────────────────────────────────────────────────────────────
# DaemonSet-based log forwarder — runs one pod per node.
#
# Pipeline:
#   [INPUT]  tail /var/log/containers/*.log  (CRI format)
#   [FILTER] kubernetes metadata enrichment   (pod name, namespace, labels)
#   [FILTER] modify — remove noisy fields     (logtag, stream)
#   [OUTPUT] elasticsearch fluent-bit-* index (logstash format)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: efk-fluent-bit
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 3: Elasticsearch must be running before Fluent Bit starts shipping logs
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default

  source:
    repoURL: 'https://fluent.github.io/helm-charts'
    chart: fluent-bit
    targetRevision: '0.47.10'
    helm:
      releaseName: fluent-bit
      values: |
        kind: DaemonSet

        labels:
          component: efk

        # Tolerations — run on ALL nodes including tainted system and spot nodes
        tolerations:
          - key: "node-role.kubernetes.io/master"
            operator: Exists
            effect: NoSchedule
          - key: "node-role.kubernetes.io/control-plane"
            operator: Exists
            effect: NoSchedule
          - operator: Exists
            effect: NoExecute
          - operator: Exists
            effect: NoSchedule

        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

        # ── Fluent Bit pipeline configuration ──────────────────────────────────
        config:
          service: |
            [SERVICE]
                Flush         1
                Log_Level     info
                Daemon        off
                Parsers_File  /fluent-bit/etc/parsers.conf
                HTTP_Server   On
                HTTP_Listen   0.0.0.0
                HTTP_Port     2020

          inputs: |
            [INPUT]
                Name              tail
                Tag               kube.*
                Path              /var/log/containers/*.log
                Parser            cri
                DB                /var/log/flb_kube.db
                Mem_Buf_Limit     5MB
                Skip_Long_Lines   On
                Refresh_Interval  10

          filters: |
            [FILTER]
                Name                kubernetes
                Match               kube.*
                Kube_URL            https://kubernetes.default.svc:443
                Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
                Kube_Tag_Prefix     kube.var.log.containers.
                Merge_Log           On
                Merge_Log_Key       log_processed
                Keep_Log            Off
                K8S-Logging.Parser  On
                K8S-Logging.Exclude On
                Labels              On
                Annotations         Off

            [FILTER]
                Name   modify
                Match  kube.*
                Remove logtag
                Remove stream

          outputs: |
            [OUTPUT]
                Name               es
                Match              kube.*
                Host               elasticsearch-master.logging.svc.cluster.local
                Port               9200
                Logstash_Format    On
                Logstash_Prefix    fluent-bit
                Retry_Limit        False
                Replace_Dots       On
                Suppress_Type_Name On
                tls                Off
                Generate_ID        On
                Write_Operation    create

          customParsers: |
            [PARSER]
                Name        cri
                Format      regex
                Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
                Time_Key    time
                Time_Format %Y-%m-%dT%H:%M:%S.%L%z

            [PARSER]
                Name        docker
                Format      json
                Time_Key    time
                Time_Format %Y-%m-%dT%H:%M:%S.%L
                Time_Keep   On

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---

# ── 3. Kibana ─────────────────────────────────────────────────────────────────
# Log visualization and exploration UI.
# Exposed via the INTERNAL Ingress Controller (nginx-internal) at /kibana.
#
# Access: http://<INTERNAL-NLB-IP>/kibana (requires VPN or kubectl port-forward)
# Service type is ClusterIP — no direct public exposure.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: efk-kibana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 3: Elasticsearch must be running before Kibana starts
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default

  source:
    repoURL: 'https://helm.elastic.co'
    chart: kibana
    targetRevision: '8.5.1'
    helm:
      releaseName: kibana
      values: |
        imageTag: "8.15.0"

        # Elasticsearch connection (no TLS, no auth)
        elasticsearchHosts: "http://elasticsearch-master.logging.svc.cluster.local:9200"

        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

        # ClusterIP — routed via nginx-internal Ingress
        service:
          type: ClusterIP

        healthCheckPath: "/app/kibana"

        # Disable cert/secret references (security is off)
        elasticsearchCertificateSecret: ""
        elasticsearchCertificateAuthoritiesFile: ""
        elasticsearchCredentialSecret: ""

        # Kibana server config — disable security features to match Elasticsearch
        kibanaConfig:
          kibana.yml: |
            server.name: taskmanager-kibana
            server.host: "0.0.0.0"
            xpack.security.enabled: false
            telemetry.enabled: false
            monitoring.ui.enabled: false

        # Pin Kibana to system_nodes
        nodeSelector:
          nodegroup: system

        labels:
          component: efk

        # Disable secret mounts (no TLS)
        secretMounts: []

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
