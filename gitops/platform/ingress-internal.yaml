# ─── Internal Ingress Controller (nginx-internal) ────────────────────────────
#
# Provisions an INTERNAL-ONLY AWS Network Load Balancer in the PRIVATE subnets.
# No public IP — only reachable from within the VPC (via VPN or SSM tunnel).
#
# Access model:
#   http://<internal-nlb-ip>/grafana/   → Grafana
#   http://<internal-nlb-ip>/kibana/    → Kibana
#   http://<internal-nlb-ip>/argocd/    → ArgoCD
#   http://<internal-nlb-ip>/jaeger/    → Jaeger UI
#
# Access requires one of:
#   - AWS Client VPN / WireGuard / Tailscale (connects to 10.0.0.0/16)
#   - AWS SSM Session Manager port-forwarding
#   - kubectl port-forward (dev convenience only)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-internal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Sync Wave 1: Ingress controllers must come up before admin tools
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: 'https://kubernetes.github.io/ingress-nginx'
    chart: ingress-nginx
    targetRevision: '4.10.1'
    helm:
      releaseName: nginx-internal
      values: |
        controller:
          # Unique class name — only Ingress objects with ingressClassName: nginx-internal
          # are served by this controller
          ingressClass: nginx-internal
          ingressClassByName: true

          ingressClassResource:
            name: nginx-internal
            enabled: true
            default: false
            controllerValue: "k8s.io/nginx-internal"

          # Launch an INTERNAL-ONLY AWS NLB — NO public IP, VPC-only
          service:
            type: LoadBalancer
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
              service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
              service.beta.kubernetes.io/aws-load-balancer-name: "taskmanager-internal-nlb"
              service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

          # Pin Ingress controller to system_nodes
          nodeSelector:
            nodegroup: system

          # Allow cross-namespace service references (needed for Grafana/Kibana/ArgoCD
          # Ingress rules that reference services in other namespaces)
          config:
            allow-snippet-annotations: "true"
            enable-real-ip: "true"

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
