# ─── Karpenter EC2NodeClass & NodePool (Application Workloads) ─────────────────
#
# EC2NodeClass:  Defines HOW Karpenter launches EC2 instances
#                (AMI, subnets, security groups, instance profile, tags).
#
# NodePool:      Defines WHICH pods Karpenter manages and with what constraints
#                (instance families, capacity types, disruption policy).
#
# Karpenter dynamically provisions Spot/On-Demand EC2 nodes from the NodePool
# when application pods (frontend/backend) become Pending due to insufficient
# CPU/memory capacity on existing nodes.
# ──────────────────────────────────────────────────────────────────────────────

---
# ─── 1. EC2NodeClass: Controls AWS-level provisioning parameters ───────────────
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: app-nodeclass
  annotations:
    # Karpenter uses cluster tag discovery for subnets & security groups.
    # Tag your VPC subnets and node security group with this tag in Terraform.
    description: "Discovers private subnets and EKS node security group by cluster tag"
spec:
  # AL2023 is the modern, optimised Amazon Linux for EKS (replaces AL2).
  amiFamily: AL2023

  # In Karpenter v1, amiSelectorTerms is required
  amiSelectorTerms:
    - alias: al2023@latest

  # Subnet discovery: Karpenter finds private subnets tagged with this key=value.
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-cluster

  # Security group discovery: attaches the EKS node security group to launched instances.
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-cluster

  # IAM instance profile attached to Karpenter-launched EC2 nodes.
  instanceProfile: eks-cluster-karpenter-node-profile

  # Root volume: 20 GB gp3 with encryption enabled.
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  # Tags applied to all EC2 instances launched by Karpenter.
  tags:
    Name: eks-cluster-karpenter-node
    ManagedBy: Karpenter
    nodegroup: app
    karpenter.sh/nodepool: app-nodepool

---
# ─── 2. NodePool: Controls pod scheduling and scaling policy ──────────────────
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: app-nodepool
  annotations:
    description: "Dynamic Spot/On-Demand pool for frontend and backend application pods"
spec:
  template:
    metadata:
      # Apply the 'app' nodegroup label so existing nodeSelector in
      # frontend-deployment.yaml and backend-deployment.yaml routes pods here.
      labels:
        nodegroup: app
        role: application
        karpenter.sh/nodepool: app-nodepool

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: app-nodeclass

      requirements:
        # ── Instance Architecture ──────────────────────────────────────────────
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        # ── Capacity Type: Spot first, On-Demand fallback ─────────────────────
        # Karpenter tries Spot first for max cost savings (~70% cheaper).
        # Falls back to On-Demand automatically if no Spot capacity is available.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

        # ── Instance Families: Cost-effective general-purpose instances ────────
        # t3/t3a: Burstable — ideal for variable API workloads.
        # c6i/c5: Compute-optimised — scales into during sustained high load.
        # m6i/m5: Balanced memory+CPU for larger backend replica counts.
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - t3.small
            - t3.medium
            - t3a.small
            - t3a.medium
            - c6i.large
            - c5.large
            - m6i.large
            - m5.large

        # ── OS: Amazon Linux only ─────────────────────────────────────────────
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

  # ── Resource Limits for the Entire NodePool ──────────────────────────────────
  # Hard ceiling: Karpenter will never provision nodes beyond this total.
  # Protects against runaway scaling from misconfigured HPA/KEDA targets.
  limits:
    cpu: "100" # 100 vCPUs across all Karpenter-managed app nodes
    memory: "200Gi" # 200 GB RAM across all Karpenter-managed app nodes

  # ── Disruption & Node Consolidation Policy ────────────────────────────────────
  disruption:
    # WhenEmptyOrUnderutilized: Karpenter automatically merges and terminates nodes
    # that are running below capacity. Reduces wasted EC2 costs during off-peak.
    consolidationPolicy: WhenEmptyOrUnderutilized

    # Minimum 30 seconds before Karpenter attempts to consolidate an underused node.
    consolidateAfter: 30s

    # budgets: Limit how aggressively Karpenter disrupts nodes at once.
    # Ensures at least 80% of nodes remain running during consolidation sweeps.
    budgets:
      - nodes: "20%"
